        <!-- dropdown script -->
        <script>
            const pocButton = document.getElementById('poc-button');
            const pocMenu = document.getElementById('poc-submenu');
            const ResourcesButton = document.getElementById('Resources-button');
            const ResourcesMenu = document.getElementById('Resources-submenu');

            // Toggle visibility for each dropdown
            pocButton.addEventListener('click', () => {
                pocMenu.style.display = pocMenu.style.display === 'block' ? 'none' : 'block';
                ResourcesMenu.style.display = 'none'; // close other menu if open
            });

            ResourcesButton.addEventListener('click', () => {
                ResourcesMenu.style.display = ResourcesMenu.style.display === 'block' ? 'none' : 'block';
                pocMenu.style.display = 'none'; // close other menu if open
            });

            // Close both menus if clicking outside
            document.addEventListener('click', (e) => {
                if (!document.getElementById('poc-access').contains(e.target) &&
                    !document.getElementById('Resources-access').contains(e.target)) {
                    pocMenu.style.display = 'none';
                    ResourcesMenu.style.display = 'none';
                }
            });
        </script>

        <script>
            // Dropdown toggle functionality
            document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();

                    const card = this.closest('.dropdown-card');

                    // Close all other dropdowns
                    document.querySelectorAll('.dropdown-card').forEach(c => {
                        if (c !== card) c.classList.remove('open');
                    });

                    // Toggle current dropdown
                    card.classList.toggle('open');
                });
            });

            // Close ALL dropdowns when clicking outside
            document.addEventListener('click', () => {
                document.querySelectorAll('.dropdown-card').forEach(card => {
                    card.classList.remove('open');
                });
            });
        </script>
