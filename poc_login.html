  <style>
    body {
      background-color: white;
      color: #00308F;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
    }

    /* ==========================
    Header
    ========================== */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: white;
      border-bottom: 2px solid #00308F;
    }

    /* Logos */
    .header-logo {
      height: 90px;
      width: auto;
      max-width: 100%;
    }

    /* Header text */
    .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: #00308F;
      font-weight: bold;
      margin: 0 auto;
      /* centers horizontally */
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: calc(100vh - 100px);
    }

    .form_area {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: transparent;
      border: 2px solid #264143;
      border-radius: 20px;
      box-shadow: 3px 4px 0px 1px rgb(191, 191, 191);
    }

    .form_style {
      outline: none;
      border: 2px solid #264143;
      box-shadow: 3px 4px 0px 1px rgb(191, 191, 191);
      width: 290px;
      padding: 12px;
      border-radius: 4px;
      font-size: 15px;
      font-family: 'Orbitron', sans-serif;
      color: #00308F;
    }

    .btn {
      padding: 15px;
      margin: 20px 0px;
      width: 290px;
      font-size: 15px;
      color: #00308F;
      background: transparent;
      border-radius: 10px;
      font-weight: 800;
      box-shadow: 3px 3px 0px 0px rgb(191, 191, 191);
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
    }

    .btn:hover {
      opacity: .9;
    }
  </style>
</head>
